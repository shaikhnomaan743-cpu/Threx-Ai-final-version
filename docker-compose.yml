version: "3.8"
# Threx AI — Full stack. From repo root: docker compose up --build
services:
  backend:
    build:
      context: ./backend/cybersentinel-backend
      dockerfile: Dockerfile
    container_name: threx-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9090:9090"
    env_file: ./backend/cybersentinel-backend/.env
    environment:
      - CYBERSENTINEL_ENV=${CYBERSENTINEL_ENV:-production}
      - CYBERSENTINEL_CORS_ORIGINS=http://localhost:80,http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/cybersentinel-backend/data:/app/data
      - ./backend/cybersentinel-backend/app/models/artifacts:/app/app/models/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: threx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: threx-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: threx-postgres
    restart: unless-stopped
    env_file: ./backend/cybersentinel-backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threxai}
      POSTGRES_USER: ${POSTGRES_USER:-threx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threx}"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pg_data:
