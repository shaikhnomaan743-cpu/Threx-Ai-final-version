[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cybersentinel-backend"
version = "2.0.0"
description = "AI-powered passive cyber threat detection backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "scipy>=1.11.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.1.0",
    "aiokafka>=0.8.0",
    "prometheus-client>=0.20.0",
]

dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx[extra]>=0.27.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.2",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx[extra]>=0.27.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.2",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*"]
addopts = "-q"