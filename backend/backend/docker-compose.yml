version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - CYBERSENTINEL_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - CYBERSENTINEL_ENV=production
      - CYBERSENTINEL_LOG_LEVEL=info
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
